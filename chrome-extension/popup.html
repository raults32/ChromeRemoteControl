<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Chrome Remote Control</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        width: 280px;
        padding: 16px;
        background: #09090b;
        color: #f4f4f5;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        background: #27272a;
        color: #a1a1aa;
      }
      .badge.online {
        background: rgba(6, 182, 212, 0.16);
        color: #22d3ee;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      label {
        display: block;
        font-size: 12px;
        color: #a1a1aa;
        margin-bottom: 6px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      input {
        flex: 1;
        background: #18181b;
        border: 1px solid #27272a;
        color: #f4f4f5;
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 13px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        background: #0891b2;
        color: #ffffff;
      }
      button.secondary {
        width: 100%;
        background: #27272a;
        color: #e4e4e7;
      }
      button:hover {
        filter: brightness(1.1);
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.4;
        color: #71717a;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="title">Remote Control Bridge</span>
      <span id="statusBadge" class="badge">
        <span class="dot"></span>
        <span id="statusText">Checking...</span>
      </span>
    </div>

    <label for="portInput">Local PC server port</label>
    <div class="row">
      <input id="portInput" type="number" min="1024" max="65535" value="8765" />
      <button id="saveBtn" type="button">Save</button>
    </div>

    <button id="reconnectBtn" class="secondary" type="button">Reconnect now</button>

    <p class="hint">
      Automatically connects to <code>127.0.0.1</code> to sync live tabs, bookmarks, and HTML5 media controls with your phone.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
