name: Build and Publish Chrome Remote Control Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v1.1.0)"
        required: false
        default: "v1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build mobile PWA frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package Extension-Only & Full Windows distributions
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "${{ inputs.tag_name }}" }
          if (-not $tag) { $tag = "v1.1.0" }

          # 1) Lightweight Chrome Extension ZIP (serverless instant WebRTC QR mode)
          $extZip = "ChromeRemoteControl-Extension-$tag.zip"
          Compress-Archive -Path "chrome-extension/*" -DestinationPath $extZip -Force

          # 2) Full Windows Bundle (Extension + Silent Windows Agent + Prebuilt PWA)
          New-Item -ItemType Directory -Force -Path "release_stage/ChromeRemoteControl/backend" | Out-Null
          New-Item -ItemType Directory -Force -Path "release_stage/ChromeRemoteControl/frontend" | Out-Null

          Copy-Item "backend/*.py" "release_stage/ChromeRemoteControl/backend/" -Force
          Copy-Item "backend/requirements.txt" "release_stage/ChromeRemoteControl/backend/" -Force
          Copy-Item "chrome-extension" "release_stage/ChromeRemoteControl/chrome-extension" -Recurse -Force
          Copy-Item "frontend/dist" "release_stage/ChromeRemoteControl/frontend/dist" -Recurse -Force
          Copy-Item "install-silent-startup.bat" "release_stage/ChromeRemoteControl/" -Force
          Copy-Item "uninstall-silent-startup.bat" "release_stage/ChromeRemoteControl/" -Force
          Copy-Item "start.bat" "release_stage/ChromeRemoteControl/" -Force
          Copy-Item "start.sh" "release_stage/ChromeRemoteControl/" -Force
          Copy-Item "README.md" "release_stage/ChromeRemoteControl/" -Force

          $winZip = "ChromeRemoteControl-Windows-$tag.zip"
          Compress-Archive -Path "release_stage/ChromeRemoteControl/*" -DestinationPath $winZip -Force

          "EXT_ZIP=$extZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WIN_ZIP=$winZip" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REL_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:REL_TAG >$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:REL_TAG $env:EXT_ZIP $env:WIN_ZIP --clobber
          } else {
            gh release create $env:REL_TAG $env:EXT_ZIP $env:WIN_ZIP --title "Chrome Remote Control $env:REL_TAG" --generate-notes --latest
          }
